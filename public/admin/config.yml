backend:
  name: github
  repo: jvegaalbela-png/jvegaalbela-png.github.io
  branch: main
  base_url: https://sveltia-cms-auth.jvegaalbela.workers.dev

media_folder: public/uploads/blog
public_folder: /uploads/blog

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Publish Date
        name: pubDate
        widget: datetime
      - label: Updated Date
        name: updatedDate
        widget: datetime
        required: false
      - label: Hero Image
        name: heroImage
        widget: image
        required: false
      - label: Tags
        name: tags
        widget: list
        default: []
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Body
        name: body
        widget: markdown

  - name: pdfs
    label: PDFs
    files:
      - name: pdfs_data
        label: PDF Library
        file: src/data/pdfs.json
        # Leading slash = repo-root-relative. Without it, Sveltia
        # resolves these paths relative to the manifest file's
        # directory (src/data/), and uploads land in
        # src/data/public/pdfs/ — which Astro never serves.
        media_folder: /public/pdfs
        public_folder: /pdfs
        fields:
          - label: Categories
            name: categories
            widget: list
            fields:
              - label: ID
                name: id
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Blurb
                name: blurb
                widget: text
              - label: Items
                name: items
                widget: list
                fields:
                  - label: PDF File
                    name: file
                    widget: file
                    media_folder: /public/pdfs
                    public_folder: /pdfs
                  - label: Thumbnail
                    name: thumbnail
                    widget: image
                    media_folder: /public/pdfs/_thumbs
                    public_folder: /pdfs/_thumbs
                    required: false
                    hint: Optional — leave blank and a thumbnail will be auto-generated by `npm run pdfs:thumbs` on the next build.
                  - label: Title
                    name: title
                    widget: string
                  - label: Description
                    name: description
                    widget: text
                    required: false
          - label: Handwritten Section
            name: handwritten
            widget: object
            fields:
              - label: Blurb
                name: blurb
                widget: text
              - label: Items
                name: items
                widget: list
                fields:
                  - label: PDF File
                    name: file
                    widget: file
                    media_folder: /public/pdfs/handwritten
                    public_folder: /pdfs/handwritten
                  - label: Title
                    name: title
                    widget: string
                  - label: Description
                    name: description
                    widget: text
                    required: false