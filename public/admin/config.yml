backend:
  name: github
  repo: jvegaalbela-png/jvegaalbela-png.github.io
  branch: main
  base_url: https://sveltia-cms-auth.jvegaalbela.workers.dev

media_folder: public/uploads/blog
public_folder: /uploads/blog

# Slugify uploaded filenames so media never enters the repo with spaces or
# odd characters (Sveltia default keeps raw names). The site's PDF page URLs
# come from explicit slug fields, so renamed uploads stay URL-stable.
media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Publish Date
        name: pubDate
        widget: datetime
      - label: Updated Date
        name: updatedDate
        widget: datetime
        required: false
      - label: Hero Image
        name: heroImage
        widget: image
        required: false
      - label: Tags
        name: tags
        widget: list
        default: []
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: false
      - label: Body
        name: body
        widget: markdown

  - name: metronome
    label: Metronome Page
    files:
      - name: practice_guide
        label: Practice Guide (long-form article)
        file: src/content/metronome-guide/practice-guide.mdx
        format: frontmatter
        fields:
          - label: Internal Title
            name: title
            widget: string
            hint: For your reference in the CMS only — not shown on the page.
          - label: Guide Content
            name: body
            widget: markdown
            hint: >-
              This is the full practice-guide article below the metronome
              tool on jva-music.com/metronome. Section headings (the bold
              lines like "<h2 id=\"odd-meters\">Odd Meters...</h2>") carry
              hidden ids used by internal links and by Google's structured
              data — you can freely reword the heading text between the
              tags, but please don't delete the id="..." part or remove a
              heading entirely.

  - name: pdfs
    label: PDFs
    files:
      - name: pdfs_data
        label: PDF Library
        file: src/data/pdfs.json
        # Leading slash = repo-root-relative. Without it, Sveltia
        # resolves these paths relative to the manifest file's
        # directory (src/data/), and uploads land in
        # src/data/public/pdfs/ — which Astro never serves.
        media_folder: /public/pdfs
        public_folder: /pdfs
        fields:
          - label: Categories
            name: categories
            widget: list
            fields:
              - label: ID
                name: id
                widget: string
              - label: Title
                name: title
                widget: string
              - label: Blurb
                name: blurb
                widget: text
              - label: Items
                name: items
                widget: list
                fields:
                  - label: PDF File
                    name: file
                    widget: file
                    media_folder: /public/pdfs
                    public_folder: /pdfs
                    accept: application/pdf,.pdf
                  - label: Title
                    name: title
                    widget: string
                  - label: Slug
                    name: slug
                    widget: string
                    required: false
                    hint: >-
                      URL identifier — lowercase letters, numbers, hyphens only. Leave blank to
                      auto-derive from the title. Changing this changes the page URL, so keep it
                      stable across file updates.
                  - label: Description
                    name: description
                    widget: text
                    required: false
                  - label: How to Practice
                    name: howToPractice
                    widget: markdown
                    required: false
                    hint: >-
                      Practice notes and context for this PDF. Appears as the "How to practice this"
                      section on the PDF's detail page. Supports **bold**, [links](/metronome/),
                      and paragraphs (separated by blank lines). Leave blank for a "Coming soon" placeholder.
          - label: Handwritten Section
            name: handwritten
            widget: object
            fields:
              - label: Blurb
                name: blurb
                widget: text
              - label: Items
                name: items
                widget: list
                fields:
                  - label: PDF File
                    name: file
                    widget: file
                    media_folder: /public/pdfs/handwritten
                    public_folder: /pdfs/handwritten
                    accept: application/pdf,.pdf
                  - label: Title
                    name: title
                    widget: string
                  - label: Description
                    name: description
                    widget: text
                    required: false